    <h3 class="mt-1 text-xl font-black">いまの傾向は<span class="text-quest-600">「${L(t[0])}×${L(t[1])}」</span></h3>
    <div class="mt-4">${radar(S.scores,'w-full max-w-[220px]')}</div>
    <div class="mt-3 text-left space-y-2">${t.map(k=>`<div class="rounded-xl bg-slate-50 border border-slate-200 p-3 text-sm">${JOBS[k].icon} <b>${JOBS[k].job}</b><p class="text-xs text-slate-500 mt-0.5">${L(k)}が活きる仕事の一例</p></div>`).join('')}</div>
    <p class="mt-3 text-[11px] text-slate-400">※ 診断ではなく、今日の選択から見えた「傾向」です。</p>
    <button data-act="finish" class="mt-4 w-full py-3.5 rounded-xl bg-quest-600 text-white font-bold hover:bg-quest-700 transition">ホームへ戻る</button></div>`;
  }
  openSheet(`<div class="shrink-0 px-5 pt-5 pb-3"><div class="flex items-center justify-between"><h3 class="font-black">${q.emoji} ${q.title}</h3><button data-act="closeSheet" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 grid place-items-center" aria-label="閉じる">×</button></div>
    <div class="mt-3 h-2 rounded-full bg-quest-100 overflow-hidden"><div class="bar h-full rounded-full bg-gradient-to-r from-quest-500 to-pink-400" style="width:${phase==='done'?100:prog}%"></div></div></div>
    <div class="overflow-y-auto px-5 pb-8">${body}</div>`);
}

/* ================= main render ================= */
function render(){
  const r=S.role, t=S.tab[r];
  $('#hdr').className='relative z-20 text-white px-4 pt-3 pb-3 shrink-0 hdr-'+r;
  $('#roleName').textContent=ROLE_SUB[r];
  $('#roleSw').innerHTML=Object.entries(ROLES).map(([k,l])=>`<button data-act="role" data-v="${k}" class="py-1.5 rounded-full transition ${r===k?'bg-white text-slate-900':'text-white/80'}">${l}</button>`).join('');
  const views={student:{home:studentHome,discover:studentDiscover,saved:studentSaved,map:studentMap,me:studentMe},parent:{home:parentHome,karte:parentKarte,talk:parentTalk}};
  $('#main').innerHTML=views[r][t]();
  $('#main').scrollTop=0;
  $('#tabbar').innerHTML=`<div class="grid" style="grid-template-columns:repeat(${TABS[r].length},1fr)">${TABS[r].map(x=>`<button data-act="tab" data-v="${x.id}" class="flex flex-col items-center gap-0.5 py-2 ${t===x.id?'text-quest-600':'text-slate-400'}"><span class="text-xl ${t===x.id?'':'grayscale opacity-70'}">${x.i}</span><span class="text-[10px] font-bold whitespace-nowrap">${x.l}</span></button>`).join('')}</div>`;
}

/* ================= actions ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const d=el.dataset, a=d.act;
  if(a==='role'){S.role=d.v;render();}
  else if(a==='tab'){S.tab[S.role]=d.v;render();}
  else if(a==='bell'){bellSheet();}
  else if(a==='closeSheet'){closeSheet();}
  else if(a==='share'){const st=$('#main').scrollTop;S.share=!S.share;render();$('#main').scrollTop=st;toast(S.share?'保護者との共有をオンにしました':'共有をオフにしました');}
  else if(a==='dismiss'){S.bannerOff=true;render();}
  else if(a==='filter'){S.filter=d.v;render();}
  else if(a==='goSearch'){S.tab.student='discover';render();const i=$('#q');if(i)i.focus();}
  else if(a==='cat'){S.filter=d.k;S.q='';S.tab.student='discover';render();}
  else if(a==='soon'){toast('このカテゴリはもうすぐ公開です');}
  else if(a==='save'){const st=$('#main').scrollTop;const k=d.k;S.saved=isSaved(k)?S.saved.filter(x=>x!==k):[...S.saved,k];render();$('#main').scrollTop=st;toast(isSaved(k)?'気になるに追加しました':'気になるから外しました');}
  else if(a==='talked'){const st=$('#main').scrollTop;S.talked[d.i]=!S.talked[d.i];render();$('#main').scrollTop=st;}
  else if(a==='start'){playQuest(d.id);}
  else if(a==='choose'){
    const c=P.q.steps[P.step].c[+d.i];
    Object.entries(c.s).forEach(([k,v])=>S.scores[k]=Math.min(100,S.scores[k]+v));
    S.xp+=40; S.history.push({quest:P.q.title,text:c.t});
    P.pick=+d.i; P.phase='fb'; renderPlayer();
  }
  else if(a==='next'){
    if(P.step===P.q.steps.length-1){ if(!S.done.includes(P.q.id)){S.done.push(P.q.id);} S.xp+=30; P.phase='done'; }
    else { P.step++; P.phase='q'; }
    renderPlayer();
  }
  else if(a==='finish'){closeSheet();S.tab.student='home';render();toast('適性マップが更新されました！');}
});
document.addEventListener('input',e=>{ if(e.target.id==='memo') S.memo=e.target.value; if(e.target.id==='q'){S.q=e.target.value;$('#qres').innerHTML=results();} });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });
render();
</script>
</body>
</html>
